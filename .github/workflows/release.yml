name: Release QuickStart Projects

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Zip each project
        run: |
          mkdir -p dist
          for dir in Projects/*/; do
            name=$(basename "$dir")
            echo "Zipping $name -> dist/OneAI_${name}.zip"
            zip -r "dist/OneAI_${name}.zip" "$dir"
          done
          ls -lh dist/

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: "1.0"
          name: "QuickStart Projects v1.0"
          body: "All OneAI QuickStart project datasets and models, packaged for use with ONE AI."
          artifacts: "dist/*.zip"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
