name: Release QuickStart Projects

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Zip each project
        run: |
          mkdir -p dist
          for dir in Chess Chips NIST Wildfire Scratches Tumor DronesAndBirds Cups Tennis Persons; do
            if [ -d "$dir" ]; then
              echo "Zipping $dir -> dist/OneAI_${dir}.zip"
              zip -r "dist/OneAI_${dir}.zip" "$dir/"
            fi
          done
          ls -lh dist/

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: "1.0"
          name: "QuickStart Projects v1.0"
          body: "All OneAI QuickStart project datasets and models, packaged for use with ONE AI."
          artifacts: "dist/*.zip"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
